# Chaînes françaises. Les clés doivent être identiques à celles de en.toml
# (voir `src/i18n.rs`), qui sert de repli compile-time.
_version = 1

[cmd]
start = "démarrer / voir le statut de connexion"
login = "connecter un compte JMAP : /login <server_url> <token>"
logout = "supprimer les identifiants stockés (droit à l'effacement RGPD)"
status = "statut du compte connecté"
shared = "gérer les notifications des boîtes JMAP partagées"
accounts = "compte perso supplémentaire : /accounts <server_url> <token> (sans argument : liste ceux déjà connectés)"
mute = "filtrer un expéditeur/mot-clé : /mute <terme> (sans argument : liste les filtres actifs)"
unmute = "annule un filtre : /unmute <terme>"
search = "recherche plein texte dans la boîte : /search <texte>"
lang = "changer la langue du bot : /lang <en|fr>"
help = "afficher l'aide"

[bot]
no_account = "Aucun compte connecté. Tape /login pour commencer."
unauthorized = "⛔ Accès non autorisé. Ce bot est réservé à des utilisateurs autorisés."
unknown_command = "Commande inconnue. Tape /help pour la liste des commandes."
delete_token_login = "⚠️ Je n'ai pas pu supprimer ton message /login. Le jeton reste visible dans l'historique : supprime-le manuellement et envisage de le révoquer et d'en générer un nouveau chez ton fournisseur JMAP."
delete_token_accounts = "⚠️ Je n'ai pas pu supprimer ton message /accounts. Le jeton reste visible dans l'historique : supprime-le manuellement et envisage de le révoquer et d'en générer un nouveau chez ton fournisseur JMAP."
welcome = "👋 Bienvenue.\n\nPour recevoir tes mails ici, connecte ton compte JMAP avec :\n/login <server_url> <token>\n\n• server_url est l'URL racine du serveur JMAP de ton fournisseur (ex. Fastmail : https://jmap.fastmail.com) - le bot découvre automatiquement le point d'entrée via /.well-known/jmap.\n• token est un jeton d'API (Bearer), pas ton mot de passe - génère-le dans les paramètres de sécurité de ton fournisseur.\n\nCe message /login sera automatiquement supprimé du chat juste après, pour ne pas laisser le jeton traîner dans l'historique."
login_failed = "❌ Connexion impossible : %{error}"
init_failed = "❌ Erreur lors de l'initialisation : %{error}"
storage_error = "❌ Erreur de stockage : %{error}"
