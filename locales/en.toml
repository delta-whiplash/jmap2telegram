# English strings. Every key here must exist in fr.toml too (see
# `src/i18n.rs`); "en" is the compile-time fallback for a key missing in
# another locale.
_version = 1

[cmd]
start = "start / show connection status"
login = "connect a JMAP account: /login <server_url> <token>"
logout = "delete stored credentials (GDPR right to erasure)"
status = "status of the connected account"
shared = "manage notifications for shared JMAP mailboxes"
accounts = "additional personal account: /accounts <server_url> <token> (no argument: list connected)"
mute = "filter a sender/keyword: /mute <term> (no argument: list active filters)"
unmute = "remove a filter: /unmute <term>"
search = "full-text search in the mailbox: /search <text>"
lang = "change the bot language: /lang <en|fr>"
help = "show help"

[bot]
no_account = "No account connected. Type /login to get started."
unauthorized = "⛔ Unauthorized. This bot is restricted to authorized users."
unknown_command = "Unknown command. Type /help for the list of commands."
delete_token_login = "⚠️ I couldn't delete your /login message. The token is still visible in the history: delete it manually and consider revoking it and generating a new one with your JMAP provider."
delete_token_accounts = "⚠️ I couldn't delete your /accounts message. The token is still visible in the history: delete it manually and consider revoking it and generating a new one with your JMAP provider."
welcome = "👋 Welcome.\n\nTo get your mail here, connect your JMAP account with:\n/login <server_url> <token>\n\n• server_url is the root URL of your provider's JMAP server (e.g. Fastmail: https://jmap.fastmail.com) - the bot discovers the entry point automatically via /.well-known/jmap.\n• token is an API token (Bearer), not your password - generate it in your provider's security settings.\n\nThis /login message is deleted from the chat right after, so the token doesn't linger in the history."
login_failed = "❌ Connection failed: %{error}"
init_failed = "❌ Initialization failed: %{error}"
storage_error = "❌ Storage error: %{error}"
login_success = "✅ Connected as %{email}. You will get a notification for every new message."
logout_done = "🗑 Credentials and data deleted. Type /login to reconnect."
logout_nothing = "No account connected."
status_title = "📬 Connected as %{email}"
status_watch_on = "Watching: active ✅"
status_watch_off = "Watching: inactive ⚠️ (type /login again)"
status_state_synced = "State: in sync"
status_state_init = "State: initializing…"
status_sharing = "Active shared mailboxes: %{count} (/shared)"
status_accounts = "Additional accounts: %{count} (/accounts)"
status_filters = "Active filters: %{count} (/mute)"
accounts_need_primary = "Connect your main account with /login before adding a second one."
accounts_usage = "Usage: /accounts <server_url> <token> - like /login, but for an additional account rather than replacing the main one."
accounts_already = "%{email} is already connected to this chat."
accounts_added = "✅ %{email} connected as an additional account. Type /accounts to see the list."
accounts_list_title = "📧 Connected accounts:"
accounts_list_primary = "1. %{email} (main)"
accounts_list_extra = "%{index}. %{email}"
accounts_no_extra = "To add one: /accounts <server_url> <token>"
accounts_legend = "🗑 = disconnect this account"
shared_none = "No shared mailbox accessible with this JMAP account."
shared_title = "📂 Shared mailboxes accessible with this account - tap a button to enable or disable their notifications:\n\n🔔 notifications on · 🔕 off"
disconnect_done = "🗑 Account disconnected."
disconnect_already = "Already disconnected."
account_not_connected = "Account not connected."
shared_on = "🔔 Notifications enabled."
shared_off = "🔕 Notifications disabled."
mute_none = "No active filter. /mute <sender or keyword> to add one."
mute_list = "🔇 Active filters (no more notifications, mail stays synced):\n%{list}"
mute_added = "🔇 « %{term} » is now filtered: no more notification for matching mail."
mute_already = "« %{term} » is already filtered."
unmute_usage = "Usage: /unmute <sender or keyword>. Type /mute with no argument to see the list."
unmute_done = "🔔 « %{term} » is no longer filtered."
unmute_not_filtered = "« %{term} » was not filtered."
search_usage = "Usage: /search <text>"
search_results = "🔎 %{count} result(s) for « %{query} »:"
search_no_result = "No result for « %{query} »."
connection_error = "Connection error: %{error}"
no_account_or_disabled = "Account not connected or disabled. Type /login, /shared or /accounts."
mark_read_done = "✅ Marked as read."
undo_done = "↩️ Restored."
undo_expired = "Too late to undo."
already_read = "Already read."
full_text_partial = "⚠️ %{count} part(s) of the message could not be sent (%{listing}). Retry « Read all » to read everything again."
lang_usage = "Usage: /lang <en|fr> (current: %{current})"
lang_set = "✅ Language updated."
lang_invalid = "Unsupported language. Available: en, fr."
error_generic = "❌ Error: %{error}"

[button]
read_all = "📖 Read all"
read = "✅ Read"
read_done = "✔️ Read"
archive = "📥 Archive"
spam = "🚫 Spam"
delete = "🗑 Delete"
more = "⋯ More"
less = "⌃ Less"
undo = "↩️ Undo"

[triage]
archived = "📥 Archived."
spam = "🚫 Marked as spam."
deleted = "🗑 Moved to trash."

[notif]
title = "📧 *New message*"
mailbox = "*Mailbox:* %{label}"
from = "*From:* %{value}"
subject = "*Subject:* %{value}"
received = "*Received:* %{value}"
attachments = "📎 *Attachments:* %{value}"
attachments_more = "(+%{count} more)"
unknown_sender = "(unknown sender)"
no_subject = "(no subject)"
empty_message = "(empty message)"
empty_attachment_name = "(no name)"
unit_b = "%{value} B"
unit_kb = "%{value} KB"
unit_mb = "%{value} MB"

[watcher]
scope_primary = "your JMAP mailbox"
scope_shared = "the shared mailbox « %{label} »"
scope_extra = "the account « %{label} »"
broken = "⚠️ The connection to %{scope} has been failing for several attempts: the token may have been revoked, or the server is unreachable. Notifications are paused for this account until the connection recovers on its own.\n\nThe technical detail of each failure is recorded in the server logs.\n\nIf the token was revoked, reconnect with /login (or /shared for a shared mailbox)."
recovered = "✅ The connection to %{scope} is back, notifications resume."

[jmap]
unreachable = "JMAP server unreachable or invalid (details in server logs)"
insecure_url = "the JMAP server URL must start with https://"
invalid_url = "invalid JMAP server URL"
no_host = "JMAP server URL without a host name"
private_host = "the JMAP server '%{host}' resolves to a non-public address (%{ip}): refused to avoid an SSRF attack against the deployment's internal network. If this is a self-hosted server deliberately on a private network, enable ALLOW_PRIVATE_JMAP_HOSTS=1."
protocol = "the mail server rejected the operation (details in server logs)"
message_not_found = "message not found (maybe already deleted)"
no_archive = "this account has no JMAP Archive folder"
no_junk = "this account has no JMAP Spam/Junk folder"
no_trash = "this account has no JMAP Trash folder"
