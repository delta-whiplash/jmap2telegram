apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jmap2telegram.fullname" . }}
  labels:
    {{- include "jmap2telegram.labels" . | nindent 4 }}
spec:
  # Never scale this beyond 1: a single stateful long-poller against the
  # Telegram Bot API, backed by one local encrypted file store. See
  # values.yaml for why replicaCount isn't meant to be tuned.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "jmap2telegram.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "jmap2telegram.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: jmap2telegram
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "jmap2telegram.secretName" . }}
                  key: bot-token
            - name: AUTHORIZED_CHAT_IDS
              value: {{ .Values.telegram.authorizedChatIds | required "telegram.authorizedChatIds is required" | quote }}
            - name: DATA_DIR
              value: /data
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "jmap2telegram.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
