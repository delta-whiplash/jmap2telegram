# Default values for jmap2telegram.

image:
  repository: ghcr.io/delta-whiplash/jmap2telegram
  # Empty by default: the chart then falls back to .Chart.AppVersion, which
  # the release pipeline pins to the exact released version. A public chart
  # must never default to a mutable tag ("latest") — installs would be
  # non-reproducible and rollbacks would silently pull different code.
  # Set explicitly only to override (e.g. testing a branch build).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

telegram:
  # Bearer token from @BotFather. Required unless existingSecret is set.
  botToken: ""
  # Name of a pre-existing Secret carrying the bot token, so the token
  # never needs to sit in values.yaml / a values file / your git history.
  # The secret must have a key named "bot-token".
  existingSecret: ""
  # Comma-separated Telegram chat ids allowed to use the bot. Not a
  # credential (it's a numeric allowlist), so it's passed as a plain env
  # var rather than through a Secret.
  authorizedChatIds: ""
  # Off by default: refuses to /login to a JMAP server that resolves to a
  # private/loopback/link-local address, since AUTHORIZED_CHAT_IDS can
  # list several mutually-untrusted chats and this closes an SSRF path
  # into the cluster's internal network. Only enable this if you're
  # deliberately pointing the bot at a JMAP server on an internal network
  # you control (and trust every authorized chat with that access).
  allowPrivateJmapHosts: false

# Persistent storage for the AES-256-GCM-encrypted credential store
# (master.key + state.enc). This is the only state the bot keeps; losing
# the volume just means every user has to run /login again.
persistence:
  enabled: true
  # If set, use an existing PVC instead of creating one.
  existingClaim: ""
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 64Mi

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  # Matches gcr.io/distroless/cc-debian12:nonroot's fixed identity.
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Annotations for the pod template. Notably how the pod opts into
# annotation-based Prometheus/vmagent discovery — the chart deliberately
# never injects scrape annotations itself (discovery is the scraper's
# business, not the workload's). When metrics.service.enabled=true, wire
# them like:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "8080"
#   prometheus.io/path: /metrics
podAnnotations: {}
podLabels: {}

# Optional cluster-local Service exposing the container's health port 8080.
# That single port serves /healthz and /readyz (what the kubelet probes hit
# directly on the pod, no Service involved) as well as /metrics in
# Prometheus text format. Off by default: the bot needs no inbound traffic
# and nothing in the cluster probes it out of the box. Enable it only to
# scrape /metrics from inside the cluster (Prometheus/vmagent with a
# kubernetes_sd_configs monitor).
metrics:
  service:
    enabled: false

extraEnv: []
# For advanced per-module filtering (tracing's EnvFilter syntax), which
# always overrides logLevel below:
# - name: RUST_LOG
#   value: jmap2telegram=debug,teloxide=info

# Simple level knob: trace, debug, info, warn, or error.
logLevel: info

# IANA zone name (e.g. "Europe/Paris"), used to render notification and
# log timestamps. Defaults to UTC.
timezone: UTC
