# Default values for jmap2telegram.

image:
  repository: ghcr.io/delta-whiplash/jmap2telegram
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

telegram:
  # Bearer token from @BotFather. Required unless existingSecret is set.
  botToken: ""
  # Name of a pre-existing Secret carrying the bot token, so the token
  # never needs to sit in values.yaml / a values file / your git history.
  # The secret must have a key named "bot-token".
  existingSecret: ""
  # Comma-separated Telegram chat ids allowed to use the bot. Not a
  # credential (it's a numeric allowlist), so it's passed as a plain env
  # var rather than through a Secret.
  authorizedChatIds: ""
  # Off by default: refuses to /login to a JMAP server that resolves to a
  # private/loopback/link-local address, since AUTHORIZED_CHAT_IDS can
  # list several mutually-untrusted chats and this closes an SSRF path
  # into the cluster's internal network. Only enable this if you're
  # deliberately pointing the bot at a JMAP server on an internal network
  # you control (and trust every authorized chat with that access).
  allowPrivateJmapHosts: false

# Persistent storage for the AES-256-GCM-encrypted credential store
# (master.key + state.enc). This is the only state the bot keeps; losing
# the volume just means every user has to run /login again.
persistence:
  enabled: true
  # If set, use an existing PVC instead of creating one.
  existingClaim: ""
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 64Mi

# This app is a single stateful long-poller against the Telegram Bot API
# with a local encrypted file store: it must run as exactly one replica.
# Do not scale this up — multiple replicas would double-notify and race
# on the same volume.
replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  # Matches gcr.io/distroless/cc-debian12:nonroot's fixed identity.
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

extraEnv: []
# For advanced per-module filtering (tracing's EnvFilter syntax), which
# always overrides logLevel below:
# - name: RUST_LOG
#   value: jmap2telegram=debug,teloxide=info

# Simple level knob: trace, debug, info, warn, or error.
logLevel: info

# IANA zone name (e.g. "Europe/Paris"), used to render notification and
# log timestamps. Defaults to UTC.
timezone: UTC
