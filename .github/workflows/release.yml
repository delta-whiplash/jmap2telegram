name: Release

# Tag-driven releases: pushing a `vX.Y.Z` tag builds and publishes the
# multi-arch Docker image and the Helm chart (both to GHCR, as OCI
# artifacts), then cuts a GitHub Release with autogenerated notes.
#
# Also runnable manually (Actions -> Release -> Run workflow) for
# environments where pushing a tag directly isn't possible (e.g. a git
# credential that's allowed to push branches but not tags/refs): the
# `prep` job then creates the vX.Y.Z tag itself via the API, using this
# workflow's own GITHUB_TOKEN rather than the caller's git credentials.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0). Creates the vX.Y.Z tag if it doesn't exist yet."
        required: true

permissions:
  contents: write
  packages: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          # Anything typed into the dispatch form (or sneaked into a ref
          # name) must reach the shell through env, never through `run:`
          # interpolation — bash would expand it before any validation
          # below gets a chance to look at it.
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          # Whatever produced it — a typed dispatch input or the pushed
          # tag's ref name — the version is only trusted once this
          # whole-string check has passed; `[[ =~ ]]` anchors against the
          # entire variable, unlike grep, which anchors per line and so
          # would wave through a multi-line value whose second line is a
          # `<<EOF` heredoc (the GITHUB_OUTPUT injection shape). Every
          # later step interpolates steps.version.outputs.version, which
          # from here on can only be digits and dots.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version': expected X.Y.Z (dot-separated digits, no leading v, nothing else)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or move release tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A manual dispatch always means "release what's at this ref
          # right now" — so an existing tag for this version gets moved
          # to the dispatched commit rather than silently reused, or a
          # rebuild from an unrelated later commit would build the wrong
          # code while the tag/release still pointed at the old one.
          existing_sha=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${TAG}" \
            | jq -r '.object.sha // empty')

          if [ -z "$existing_sha" ]; then
            curl -sS -f -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs" \
              -d "{\"ref\":\"refs/tags/${TAG}\",\"sha\":\"${{ github.sha }}\"}"
            echo "Created tag ${TAG} at ${{ github.sha }}."
          elif [ "$existing_sha" != "${{ github.sha }}" ]; then
            curl -sS -f -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${TAG}" \
              -d "{\"sha\":\"${{ github.sha }}\",\"force\":true}"
            echo "Moved tag ${TAG} from ${existing_sha} to ${{ github.sha }}."
          else
            echo "Tag ${TAG} already points at ${{ github.sha }}."
          fi

  test:
    needs: prep
    uses: ./.github/workflows/ci.yml

  docker:
    needs: [prep, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        id: buildx

      # See ci.yml's docker-build job for why this is needed alongside
      # cache-from/cache-to: type=gha below (which only covers image
      # layers, not the Dockerfile's RUN --mount=type=cache dirs).
      - uses: actions/cache@v4
        id: cache
        with:
          path: cache-mount
          key: docker-cache-mount-${{ hashFiles('Dockerfile', 'Cargo.lock') }}
          restore-keys: docker-cache-mount-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ needs.prep.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prep.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.prep.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    needs: [prep, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: Set chart & app version
        run: |
          set -euo pipefail
          VERSION="${{ needs.prep.outputs.version }}"
          sed -i "s/^version:.*/version: ${VERSION}/" charts/jmap2telegram/Chart.yaml
          # appVersion keeps the leading v: docker/metadata-action publishes
          # only vX.Y.Z / X.Y / X / latest, and the chart resolves an empty
          # image.tag to appVersion — a bare version there was an
          # ImagePullBackOff waiting for default-value installs (the bug
          # behind v0.1.1's chart). Chart *version* itself stays bare, per
          # helm convention.
          sed -i "s/^appVersion:.*/appVersion: \"v${VERSION}\"/" charts/jmap2telegram/Chart.yaml

      - run: helm lint charts/jmap2telegram
      - run: helm package charts/jmap2telegram --destination /tmp/chart-out

      - name: Push chart to GHCR (OCI)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push /tmp/chart-out/jmap2telegram-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"

  github-release:
    needs: [prep, docker, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prep.outputs.version }}
          generate_release_notes: true
