name: Release

# Tag-driven releases: pushing a `vX.Y.Z` tag publishes the multi-arch
# Docker image and the Helm chart (both to GHCR, as OCI artifacts), then
# cuts a GitHub Release with autogenerated notes.
#
# Publishing is a *promotion*, not a rebuild. `main`'s CI already built and
# gated the image and published it as `sha-<sha>` (see ci.yml), so this
# workflow only re-tags that exact digest: what ships is byte-for-byte what
# CI built and tested, and that the `sha-<sha>` tag exists is itself the
# proof that every gate passed (the CI `image` job needs all of them).
#
# Also runnable manually (Actions -> Release -> Run workflow) for
# environments where pushing a tag directly isn't possible (e.g. a git
# credential that's allowed to push branches but not tags/refs): the
# `prep` job then creates the vX.Y.Z tag itself via the API, using this
# workflow's own GITHUB_TOKEN rather than the caller's git credentials.
#
# Release tags are immutable. A published `vX.Y.Z` is never re-pointed at a
# different commit, and its image digest is never overwritten: either would
# silently change what someone who already pinned or pulled that version
# gets. A dispatch that lands on an already-published version fails loudly -
# bump the version and release that. The chart is held to the same rule: an
# already-published chart version is only re-pushed when its content is
# byte-identical, which makes re-running a half-finished release a no-op
# instead of a silent rewrite.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0). Creates the vX.Y.Z tag if it doesn't exist yet; an already-published tag is never moved."
        required: true

# Least privilege at the top: each job below asks for the one write scope it
# actually needs (a job that sets `permissions` gets only what it lists).
permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          # Anything typed into the dispatch form (or sneaked into a ref
          # name) must reach the shell through env, never through `run:`
          # interpolation - bash would expand it before any validation
          # below gets a chance to look at it.
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          # Whatever produced it - a typed dispatch input or the pushed
          # tag's ref name - the version is only trusted once this
          # whole-string check has passed; `[[ =~ ]]` anchors against the
          # entire variable, unlike grep, which anchors per line and so
          # would wave through a multi-line value whose second line is a
          # `<<EOF` heredoc (the GITHUB_OUTPUT injection shape). Every
          # later step interpolates steps.version.outputs.version, which
          # from here on can only be digits and dots.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version': expected X.Y.Z (dot-separated digits, no leading v, nothing else)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out the commit being released
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The version guard the tag ruleset cannot give us. Tag immutability
      # stops a *published* tag from being moved, but nothing stops a tag
      # whose version disagrees with the code it points at - which is how
      # v0.6.0 once ended up shipping a 0.5.2 binary. Cargo.toml's version is
      # what `cargo build` stamps into the artifact, so comparing the two
      # here is what keeps the name on the tin honest.
      - name: The release version must match the crate version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # First `version = "..."` line: Cargo.toml's [package] table, which
          # cargo requires to come before the tables that may quote other
          # crates' versions. `tr -d '\r'` because a checkout with CRLF line
          # endings (a developer's autocrlf, say) would otherwise fail the
          # comparison while printing the same version twice.
          crate_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1 | tr -d '\r')"
          if [ "$crate_version" != "$VERSION" ]; then
            echo "::error::Cargo.toml says version = \"${crate_version}\" but this is release ${VERSION}. Set the crate version first, merge that, and release from the resulting commit."
            exit 1
          fi
          echo "Cargo.toml version ${crate_version} matches the release version."

      - name: Create the release tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A manual dispatch means "release what's at this ref right now",
          # but only if that version has not been published yet. Moving an
          # existing tag would rewrite history for anyone who already
          # pinned it, so the collision is reported instead of resolved.
          ref=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO_SLUG}/git/refs/tags/${TAG}")
          existing_sha=$(echo "$ref" | jq -r '.object.sha // empty')
          # An *annotated* tag's ref points at the tag object, not at the
          # commit it names, so follow it before comparing: without this,
          # re-running a release whose tag was cut with `git tag -a` looks
          # exactly like a tag that was moved, and prep refuses a legitimate
          # retry. Lightweight tags - which is what the branch below creates,
          # and what every tag in this repository's history is - need no
          # dereference.
          if [ "$(echo "$ref" | jq -r '.object.type // empty')" = "tag" ]; then
            existing_sha=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO_SLUG}/git/tags/${existing_sha}" \
              | jq -r '.object.sha // empty')
          fi

          if [ -z "$existing_sha" ]; then
            curl -sS -f -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO_SLUG}/git/refs" \
              -d "{\"ref\":\"refs/tags/${TAG}\",\"sha\":\"${SHA}\"}"
            echo "Created tag ${TAG} at ${SHA}."
          elif [ "$existing_sha" = "$SHA" ]; then
            echo "Tag ${TAG} already points at ${SHA}."
          else
            echo "::error::${TAG} already points at ${existing_sha}, not at ${SHA}. Release tags are immutable: bump the version and release that, rather than moving a published tag."
            exit 1
          fi

  promote:
    needs: [prep]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-26.04
    env:
      REPO: ghcr.io/${{ github.repository }}
      SRC: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the sha-<sha> image published by CI
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A tag can be pushed seconds after the commit, while its CI run
          # is still building the image. Poll rather than fail on the first
          # miss; a real absence (no image, or gates not all green) still
          # times out below.
          for i in $(seq 1 60); do
            if docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
              echo "found $SRC"
              exit 0
            fi
            echo "waiting for CI to publish $SRC (${i}/60)"
            sleep 10
          done
          echo "::error::$SRC was never published. Did the CI run for ${SHA} finish, and did every gate pass?"
          exit 1

      # The tag side of the same rule. `imagetools create` happily
      # overwrites an existing tag, which would leave `vX.Y.Z` pointing at
      # a digest other than the one it published - so refuse before
      # touching it. Re-running a release for the same digest stays a
      # no-op, which keeps retrying a failed run safe.
      - name: Refuse to overwrite an already-published release tag
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          set -euo pipefail
          published="$(docker buildx imagetools inspect "${REPO}:v${VERSION}" \
            --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [ -z "$published" ]; then
            echo "v${VERSION} is not published yet - nothing to refuse."
            exit 0
          fi
          built="$(docker buildx imagetools inspect "$SRC" --format '{{.Manifest.Digest}}')"
          if [ "$published" = "$built" ]; then
            echo "v${VERSION} already points at ${built}; promoting it again is a no-op."
            exit 0
          fi
          echo "::error::v${VERSION} already exists at ${published}, but this build is ${built}. Release tags are immutable: bump the version and release that, rather than republishing a published tag."
          exit 1

      # Re-tag the digest CI already built. `imagetools create` copies the
      # whole index - both platform manifests, their attestations and the
      # SBOM - so the release keeps the provenance of the tested build.
      - name: Promote the digest to the release tags
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          set -euo pipefail
          minor="${VERSION%.*}"
          major="${VERSION%%.*}"
          docker buildx imagetools create \
            -t "${REPO}:v${VERSION}" \
            -t "${REPO}:${minor}" \
            -t "${REPO}:${major}" \
            -t "${REPO}:latest" \
            "${SRC}"
          docker buildx imagetools inspect "${REPO}:v${VERSION}"

  helm:
    needs: [prep, promote]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Set chart & app version
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^version:.*/version: ${VERSION}/" charts/jmap2telegram/Chart.yaml
          # appVersion keeps the leading v: the promote job publishes only
          # vX.Y.Z / X.Y / X / latest, and the chart resolves an empty
          # image.tag to appVersion - a bare version there was an
          # ImagePullBackOff waiting for default-value installs (the bug
          # behind v0.1.1's chart). Chart *version* itself stays bare, per
          # helm convention.
          sed -i "s/^appVersion:.*/appVersion: \"v${VERSION}\"/" charts/jmap2telegram/Chart.yaml

      - run: helm lint charts/jmap2telegram
      - run: helm package charts/jmap2telegram --destination /tmp/chart-out

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      # The chart's half of the immutability rule, and the reason it has to
      # be checked here rather than left to the registry: GHCR has no
      # per-tag protection for OCI artifacts (the ruleset mechanism is a git
      # feature), so `helm push` would happily rewrite a published version.
      # The digest cannot be compared the way the image's is - `helm package`
      # stamps file mtimes into the tarball, so the same chart packaged twice
      # has two different digests - but its *content* is comparable, and a
      # byte-identical republish is exactly the case a retried run hits.
      - name: Refuse to republish a chart version with different content
        id: chart
        env:
          VERSION: ${{ needs.prep.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          oci_chart="oci://ghcr.io/${OWNER}/charts/jmap2telegram"
          oci_ref="ghcr.io/${OWNER}/charts/jmap2telegram:${VERSION}"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if ! docker buildx imagetools inspect "$oci_ref" > /dev/null 2>&1; then
            echo "chart ${VERSION} is not published yet - publishing it."
            exit 0
          fi
          # Published, so it must be identical. Every step past this point
          # is allowed to fail but not to fall through to the push below:
          # `set -e` plus the explicit diff keeps a transient failure from
          # turning into a silent overwrite.
          tmp="$(mktemp -d)"
          helm pull "$oci_chart" --version "$VERSION" --destination "$tmp" > /dev/null
          mkdir -p "${tmp}/published" "${tmp}/local"
          tar -xzf "${tmp}"/jmap2telegram-"${VERSION}".tgz -C "${tmp}/published"
          tar -xzf /tmp/chart-out/jmap2telegram-"${VERSION}".tgz -C "${tmp}/local"
          if diff -r --brief "${tmp}/local/jmap2telegram" "${tmp}/published/jmap2telegram"; then
            echo "chart ${VERSION} is already published with identical content - nothing to push."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::chart ${VERSION} is already published with different content. Chart versions are immutable: bump the version and release that."
          exit 1

      - name: Push chart to GHCR (OCI)
        if: steps.chart.outputs.publish == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          helm push /tmp/chart-out/jmap2telegram-*.tgz "oci://ghcr.io/${OWNER}/charts"

  github-release:
    needs: [prep, promote, helm]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # No checkout: `gh` is told the repository explicitly, so the job needs
      # neither a working tree nor the git credentials a checkout would leave
      # behind. `--verify-tag` fails rather than creating a release for a tag
      # that isn't there.
      - name: Cut the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          set -euo pipefail
          # A published release is left exactly as it is, like the tag and the
          # chart: that is what makes a retried run a no-op end to end, and it
          # is why notes someone may have already read cannot be rewritten
          # underneath them. (`gh release create` refuses outright when the tag
          # already has a release, which would turn a harmless retry into a
          # red run for no reason.)
          if gh release view "v${VERSION}" --repo "$REPO_SLUG" > /dev/null 2>&1; then
            echo "release v${VERSION} is already published - leaving it as it is."
            exit 0
          fi
          gh release create "v${VERSION}" \
            --repo "$REPO_SLUG" \
            --title "v${VERSION}" \
            --generate-notes \
            --verify-tag
