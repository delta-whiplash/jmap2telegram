name: Release

# Tag-driven releases: pushing a `vX.Y.Z` tag builds and publishes the
# multi-arch Docker image and the Helm chart (both to GHCR, as OCI
# artifacts), then cuts a GitHub Release with autogenerated notes.
#
# Also runnable manually (Actions -> Release -> Run workflow) for
# environments where pushing a tag directly isn't possible (e.g. a git
# credential that's allowed to push branches but not tags/refs): the
# `prep` job then creates the vX.Y.Z tag itself via the API, using this
# workflow's own GITHUB_TOKEN rather than the caller's git credentials.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0). Creates the vX.Y.Z tag if it doesn't exist yet."
        required: true

permissions:
  contents: write
  packages: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          # Anything typed into the dispatch form (or sneaked into a ref
          # name) must reach the shell through env, never through `run:`
          # interpolation - bash would expand it before any validation
          # below gets a chance to look at it.
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          # Whatever produced it - a typed dispatch input or the pushed
          # tag's ref name - the version is only trusted once this
          # whole-string check has passed; `[[ =~ ]]` anchors against the
          # entire variable, unlike grep, which anchors per line and so
          # would wave through a multi-line value whose second line is a
          # `<<EOF` heredoc (the GITHUB_OUTPUT injection shape). Every
          # later step interpolates steps.version.outputs.version, which
          # from here on can only be digits and dots.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version': expected X.Y.Z (dot-separated digits, no leading v, nothing else)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or move release tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A manual dispatch always means "release what's at this ref
          # right now" - so an existing tag for this version gets moved
          # to the dispatched commit rather than silently reused, or a
          # rebuild from an unrelated later commit would build the wrong
          # code while the tag/release still pointed at the old one.
          existing_sha=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${TAG}" \
            | jq -r '.object.sha // empty')

          if [ -z "$existing_sha" ]; then
            curl -sS -f -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs" \
              -d "{\"ref\":\"refs/tags/${TAG}\",\"sha\":\"${{ github.sha }}\"}"
            echo "Created tag ${TAG} at ${{ github.sha }}."
          elif [ "$existing_sha" != "${{ github.sha }}" ]; then
            curl -sS -f -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${TAG}" \
              -d "{\"sha\":\"${{ github.sha }}\",\"force\":true}"
            echo "Moved tag ${TAG} from ${existing_sha} to ${{ github.sha }}."
          else
            echo "Tag ${TAG} already points at ${{ github.sha }}."
          fi

  test:
    needs: prep
    uses: ./.github/workflows/ci.yml

  docker:
    needs: [prep, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # One native runner per arch. Emulating arm64 under QEMU cost ~26x
          # a native compile (49m38s of the v0.7.0 release); buildx picks the
          # native instruction set here, so no QEMU is set up at all.
          # ubuntu-26.04* are standard GitHub-hosted images, free for public
          # repos.
          - runner: ubuntu-26.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        id: buildx

      # Per-arch cache key: the two legs' cargo target dirs are arch-specific
      # and must not clobber each other. The amd64 key/scope are deliberately
      # identical to ci.yml's docker-build so a release reuses its warm
      # layers. See ci.yml's docker-build job for why cache-dance is needed
      # alongside cache-from/cache-to (which only cover image layers, not the
      # Dockerfile's RUN --mount=type=cache dirs).
      - uses: actions/cache@v4
        id: cache
        with:
          path: cache-mount
          key: docker-cache-mount-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'Cargo.lock') }}
          restore-keys: docker-cache-mount-${{ matrix.arch }}-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ needs.prep.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prep.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.prep.outputs.version }}
            type=raw,value=latest

      # Build this arch natively and push it *by digest only*: the human-facing
      # tags are attached once, in `merge`, to the combined manifest list, so
      # the two legs never race to publish the same tag.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prep, docker]
    runs-on: ubuntu-26.04
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ needs.prep.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prep.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.prep.outputs.version }}
            type=raw,value=latest

      # Stitch the two per-arch digests into one multi-arch manifest list and
      # attach every publishable tag in a single atomic write.
      - name: Create the multi-arch manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do tag_args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest_args=()
          for d in *; do digest_args+=("${REPO}@sha256:${d}"); done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect the published manifest list
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:v${{ needs.prep.outputs.version }}

  helm:
    needs: [prep, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: Set chart & app version
        run: |
          set -euo pipefail
          VERSION="${{ needs.prep.outputs.version }}"
          sed -i "s/^version:.*/version: ${VERSION}/" charts/jmap2telegram/Chart.yaml
          # appVersion keeps the leading v: docker/metadata-action publishes
          # only vX.Y.Z / X.Y / X / latest, and the chart resolves an empty
          # image.tag to appVersion - a bare version there was an
          # ImagePullBackOff waiting for default-value installs (the bug
          # behind v0.1.1's chart). Chart *version* itself stays bare, per
          # helm convention.
          sed -i "s/^appVersion:.*/appVersion: \"v${VERSION}\"/" charts/jmap2telegram/Chart.yaml

      - run: helm lint charts/jmap2telegram
      - run: helm package charts/jmap2telegram --destination /tmp/chart-out

      - name: Push chart to GHCR (OCI)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push /tmp/chart-out/jmap2telegram-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"

  github-release:
    needs: [prep, merge, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prep.outputs.version }}
          generate_release_notes: true
