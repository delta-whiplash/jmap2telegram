name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The image job publishes the per-commit `sha-<sha>` image the release
  # promotes; image-retention prunes old ones.
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --locked: fail loudly if Cargo.lock has drifted from Cargo.toml
      # instead of silently re-resolving it in CI. (It does not, as I first
      # assumed, suppress cargo's "Updating crates.io index" step.)
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/jmap2telegram
      - run: helm template charts/jmap2telegram --set telegram.botToken=dummy --set telegram.authorizedChatIds=1 > /dev/null

  gitleaks:
    # Full git history, not just the diff: a secret introduced then deleted
    # stays detectable. History is clean today (verified 2026-10-05), so no
    # baseline file is needed - a finding should fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks git . --redact --exit-code 1 -v

  # --- build once --------------------------------------------------------
  #
  # The image is built here, on every merge to main, and published under a
  # commit-addressed tag `sha-<sha>`. Doing it here rather than at release
  # time is what lets the release be a pure *promotion* (release.yml): the
  # artifact that ships is byte-for-byte the one this run built and tested.
  #
  # `needs` names *every* gate on purpose: the existence of `sha-<sha>` is
  # then proof that the whole CI suite passed for that commit, which is the
  # only check the release needs to make.
  image:
    if: github.event_name == 'push'
    needs: [fmt, clippy, test, audit, helm-lint, gitleaks]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runner per arch: emulating arm64 under QEMU cost ~26x a
          # native compile. ubuntu-26.04* are standard GitHub-hosted images,
          # free for public repos.
          - runner: ubuntu-26.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        id: buildx

      # type=gha (below) only caches image layers, not the Dockerfile's
      # RUN --mount=type=cache dirs (cargo registry + target): those are
      # builder-local state that a fresh-per-job GHA runner never has.
      # buildkit-cache-dance extracts/injects them through actions/cache
      # instead, so a Cargo.lock bump only recompiles what changed rather
      # than the whole dependency tree. Keys are per-arch: each leg's cargo
      # target dir is arch-specific and the two must not clobber each other.
      - uses: actions/cache@v4
        id: cache
        with:
          path: cache-mount
          key: docker-cache-mount-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'Cargo.lock') }}
          restore-keys: docker-cache-mount-${{ matrix.arch }}-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only: the arch-agnostic index is created once, in
      # image-merge below, so the two legs never race to publish a tag.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    if: github.event_name == 'push'
    needs: [image]
    runs-on: ubuntu-26.04
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Publish the multi-arch index as sha-<sha>
        working-directory: ${{ runner.temp }}/digests
        env:
          REPO: ghcr.io/${{ github.repository }}
          TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          digest_args=()
          for d in *; do digest_args+=("${REPO}@sha256:${d}"); done
          docker buildx imagetools create -t "${REPO}:${TAG}" "${digest_args[@]}"
          docker buildx imagetools inspect "${REPO}:${TAG}"

  # Version pruning lives in .github/scripts/prune-package-versions.sh so it
  # can be run (in dry-run) on every pull request rather than only reasoned
  # about here. See that file for the rules and their safety arguments.
  image-retention:
    if: github.event_name == 'push'
    needs: [image-merge]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.repository }}
      PKG: jmap2telegram
      MAX_AGE_DAYS: "30"
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prune old image versions
        run: bash .github/scripts/prune-package-versions.sh

  # The same script in dry-run on every pull request opened from this
  # repository, so the pruning rules are exercised continuously instead of
  # being trusted. Forks are excluded: they get a read-only token and could
  # not describe the package anyway. A pull request never mutates the
  # registry.
  image-retention-check:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.repository }}
      PKG: jmap2telegram
      MAX_AGE_DAYS: "30"
      # `github.sha` is the pull request's merge commit here, whose image
      # does not exist yet, so the dry run would never exercise the
      # HEAD-protection path. The base commit is the closest stand-in for
      # the commit a release would currently promote.
      HEAD_SHA: ${{ github.event.pull_request.base.sha }}
      DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report what pruning would delete
        run: bash .github/scripts/prune-package-versions.sh
