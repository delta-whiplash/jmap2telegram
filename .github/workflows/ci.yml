name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, widened per job below and only where a job really needs it.
# A job that sets `permissions` gets *only* what it lists, so everything that
# doesn't set any keeps this read-only default; only the three jobs that
# actually publish or prune GHCR ask for `packages: write`. (zizmor's
# excessive-permissions audit checks exactly this and now reports zero.)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every job below carries a `timeout-minutes`: the default is six hours, so
  # without one a hung job burns a runner for the afternoon instead of failing
  # in a quarter of an hour. The numbers are ~10-30x the observed duration, so
  # they catch a hang, not a slow day.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No toolchain-setup action on purpose: rust-toolchain.toml pins the
      # compiler (and rustfmt/clippy) and the runner's preinstalled rustup
      # installs it on first use. That is the same file the Docker build
      # resolves, so the compiler that checks a commit here is the one that
      # builds the shipped binary.
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # --locked: fail loudly if Cargo.lock has drifted from Cargo.toml
      # instead of silently re-resolving it in CI. (It does not, as I first
      # assumed, suppress cargo's "Updating crates.io index" step.)
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - run: cargo audit

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: helm lint charts/jmap2telegram
      - run: helm template charts/jmap2telegram --set telegram.botToken=dummy --set telegram.authorizedChatIds=1 > /dev/null

  gitleaks:
    # Full git history, not just the diff: a secret introduced then deleted
    # stays detectable. History is clean today (verified 2026-10-05), so no
    # baseline file is needed - a finding should fail the build.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks git . --redact --exit-code 1 -v

  # Audits the workflows themselves - unpinned actions, `${{ }}` expanded into
  # `run:` blocks, over-broad token permissions, cache poisoning - and fails
  # the build on anything it finds. It enforces by machine what the other jobs
  # would otherwise rely on us remembering to do by hand: every `uses:` here is
  # pinned to a commit SHA. The one finding it raises that cannot be fixed in
  # the YAML is exempted, with its argument, in .github/zizmor.yml.
  #
  # It runs online (the token below turns that on), so its impostor-commit
  # audit independently re-checks that every pinned SHA really is a commit of
  # the repository the `uses:` claims to come from.
  #
  # Downloaded from the release page at a pinned version and verified, like
  # gitleaks above, rather than pulled in as one more action to trust.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install zizmor
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/zizmorcore/zizmor/releases/download/v1.31.0/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin zizmor
          zizmor --version
      - name: Audit the workflows
        env:
          # A token switches zizmor's online audits on - notably
          # impostor-commit, which independently re-checks that every pinned
          # SHA really is a commit of the repository it claims to come from,
          # and known-vulnerable-actions. Offline, both are skipped.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor .github/workflows/

  # --- build once --------------------------------------------------------
  #
  # The image is built here, on every merge to main, and published under a
  # commit-addressed tag `sha-<sha>`. Doing it here rather than at release
  # time is what lets the release be a pure *promotion* (release.yml): the
  # artifact that ships is byte-for-byte the one this run built and tested.
  #
  # `needs` names *every* gate on purpose: the existence of `sha-<sha>` is
  # then proof that the whole CI suite passed for that commit, which is the
  # only check the release needs to make.
  image:
    if: github.event_name == 'push'
    needs: [fmt, clippy, test, audit, helm-lint, gitleaks, zizmor]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runner per arch: emulating arm64 under QEMU cost ~26x a
          # native compile. ubuntu-26.04* are standard GitHub-hosted images,
          # free for public repos.
          - runner: ubuntu-26.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        id: buildx

      # type=gha (below) only caches image layers, not the Dockerfile's
      # RUN --mount=type=cache dirs (cargo registry + target): those are
      # builder-local state that a fresh-per-job GHA runner never has.
      # buildkit-cache-dance extracts/injects them through actions/cache
      # instead, so a Cargo.lock bump only recompiles what changed rather
      # than the whole dependency tree. Keys are per-arch: each leg's cargo
      # target dir is arch-specific and the two must not clobber each other.
      #
      # Not a cache-poisoning vector despite publishing an image: this job
      # only ever runs on a push to main (`if:` above), so no pull request
      # can write these keys, and GitHub scopes a cache written on a PR's
      # merge ref to that ref alone - main never reads it. The reason this
      # cache cannot poison the artifact is recorded in .github/zizmor.yml,
      # where the one exemption it buys is written down and justified.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: cache-mount
          key: docker-cache-mount-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'Cargo.lock') }}
          restore-keys: docker-cache-mount-${{ matrix.arch }}-

      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only: the arch-agnostic index is created once, in
      # image-merge below, so the two legs never race to publish a tag.
      #
      # provenance=mode=max + sbom:true attach a full SLSA build definition and
      # an SPDX SBOM to each platform's manifest, so the question "what is
      # actually in this digest, and what built it" is answerable from the
      # registry alone - by a scanner, or by whoever pulls the image later.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          mkdir -p "$DIGESTS"
          touch "$DIGESTS/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    if: github.event_name == 'push'
    needs: [image]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # attest-build-provenance signs with this job's OIDC identity and files
      # the result in the repository's attestation store; the image push itself
      # is what needs `packages: write`.
      id-token: write
      attestations: write
    runs-on: ubuntu-26.04
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Publish the multi-arch index as sha-<sha>
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          REPO: ghcr.io/${{ github.repository }}
          TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          digest_args=()
          for d in *; do digest_args+=("${REPO}@sha256:${d}"); done
          docker buildx imagetools create -t "${REPO}:${TAG}" "${digest_args[@]}"
          docker buildx imagetools inspect "${REPO}:${TAG}"
          # Read the digest back rather than assembling it from the inputs:
          # this is the index a user pulls by tag, so it is the thing an
          # attestation should name.
          digest="$(docker buildx imagetools inspect "${REPO}:${TAG}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${TAG} at ${digest}"

      # buildkit's own provenance (in the `image` job above) lives in the
      # registry and is *unsigned*: anyone who can push to this package could
      # write an equally well-formed statement beside the image. This adds a
      # signed one - this job's OIDC identity, recorded in the repository's
      # attestation store and pushed next to the image - so that `gh
      # attestation verify` can check the claim instead of the registry
      # asserting it. Verification is documented in the README.
      - name: Attest the published index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  # Version pruning lives in .github/scripts/prune-package-versions.sh so it
  # can be run (in dry-run) on every pull request rather than only reasoned
  # about here. See that file for the rules and their safety arguments.
  image-retention:
    if: github.event_name == 'push'
    needs: [image-merge]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.repository }}
      PKG: jmap2telegram
      MAX_AGE_DAYS: "30"
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prune old image versions
        run: bash .github/scripts/prune-package-versions.sh

  # The same script in dry-run on every pull request opened from this
  # repository, so the pruning rules are exercised continuously instead of
  # being trusted. Forks are excluded: they get a read-only token and could
  # not describe the package anyway. A pull request never mutates the
  # registry. `packages: read` and not `write`: this is the one job here whose
  # token is handed to code that runs on a pull request's content.
  image-retention-check:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.repository }}
      PKG: jmap2telegram
      MAX_AGE_DAYS: "30"
      # `github.sha` is the pull request's merge commit here, whose image
      # does not exist yet, so the dry run would never exercise the
      # HEAD-protection path. The base commit is the closest stand-in for
      # the commit a release would currently promote.
      HEAD_SHA: ${{ github.event.pull_request.base.sha }}
      DRY_RUN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report what pruning would delete
        run: bash .github/scripts/prune-package-versions.sh

  # release.yml's four decisions, exercised on every pull request from this
  # repository - the same reasoning as `image-retention-check` above, and the
  # same rule: a release workflow that only ever runs during a release is a
  # workflow nobody tests. Both bugs found in release.yml so far (an annotated
  # tag read as a moved one; a release creation that failed on a retry instead
  # of doing nothing) were found in production, by cutting real releases.
  #
  # Everything below is read-only, and the one guard that *can* write - the tag
  # guard - runs in DRY_RUN, which reports what it would do. The versions used
  # as fixtures are pinned deliberately: v0.8.0 is the repository's one
  # annotated tag, v0.8.1 a lightweight one, release tags are immutable so both
  # stay as they are, and their images can never be pruned either - nothing
  # reachable from a tag is ever deleted (see prune-package-versions.sh).
  release-guards-check:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_SLUG: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      REPO: ghcr.io/${{ github.repository }}
      DRY_RUN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The release path is shell, so lint it as shell. Fetched from its
      # release page at a pinned version, like zizmor and gitleaks above.
      - name: Lint the scripts
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          /tmp/shellcheck-v0.11.0/shellcheck -S style .github/scripts/*.sh

      # A job that runs a script from this repository needs the tree: a
      # job's workspace is empty until it checks out, so the step would
      # die on a missing file (exit 127) instead of on the script's own
      # logic. That is how v0.9.0's release failed - the promote job
      # called the image-tag guard, which had just been extracted out of
      # inline shell into .github/scripts/, and the job had no checkout
      # to find it in. The guard is otherwise only exercised by a real
      # release, so its absence is invisible until a release dies.
      - name: Every job that runs a repository script checks the tree out
        run: bash .github/scripts/check-workflow-checkouts.sh

      - name: Version guard accepts Cargo.toml's version and refuses another
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1 | tr -d '\r')"
          VERSION="$crate_version" bash .github/scripts/release-guards.sh version
          if VERSION=9.9.9 bash .github/scripts/release-guards.sh version; then
            echo "::error::the version guard accepted a version Cargo.toml does not carry"
            exit 1
          fi
          echo "refused 9.9.9, as it should."

      - name: Tag guard reads both tag kinds, refuses to move either, creates nothing
        run: |
          set -euo pipefail
          # Annotated (v0.8.0) and lightweight (v0.8.1): that difference is
          # what the first bug turned on, so both kinds get exercised.
          annotated_sha="$(gh api "repos/${REPO_SLUG}/commits/v0.8.0" --jq .sha)"
          lightweight_sha="$(gh api "repos/${REPO_SLUG}/commits/v0.8.1" --jq .sha)"
          TAG=v0.8.0 SHA="$annotated_sha" bash .github/scripts/release-guards.sh tag
          TAG=v0.8.1 SHA="$lightweight_sha" bash .github/scripts/release-guards.sh tag
          if TAG=v0.8.0 SHA="$lightweight_sha" bash .github/scripts/release-guards.sh tag; then
            echo "::error::the tag guard agreed to move the annotated tag v0.8.0"
            exit 1
          fi
          if TAG=v0.8.1 SHA="$annotated_sha" bash .github/scripts/release-guards.sh tag; then
            echo "::error::the tag guard agreed to move the lightweight tag v0.8.1"
            exit 1
          fi
          TAG=v0.0.0-release-guards-check SHA="$lightweight_sha" bash .github/scripts/release-guards.sh tag
          if gh api "repos/${REPO_SLUG}/git/refs/tags/v0.0.0-release-guards-check" > /dev/null 2>&1; then
            echo "::error::the dry run created a tag"
            exit 1
          fi
          echo "both kinds dereferenced, nothing moved, nothing created."

      - name: Image-tag guard is a no-op on the same digest and refuses another
        run: |
          set -euo pipefail
          VERSION=0.8.1 SRC="${REPO}:v0.8.1" bash .github/scripts/release-guards.sh image-tag
          VERSION=9.9.9 SRC="${REPO}:v0.8.1" bash .github/scripts/release-guards.sh image-tag
          # A real, different digest: one platform manifest of the same image.
          other="$(docker buildx imagetools inspect "${REPO}:v0.8.1" \
            --format '{{range .Manifest.Manifests}}{{.Digest}}{{"\n"}}{{end}}' | head -1)"
          if VERSION=0.8.1 SRC="${REPO}@${other}" bash .github/scripts/release-guards.sh image-tag; then
            echo "::error::the image-tag guard agreed to re-point v0.8.1 at another digest"
            exit 1
          fi
          echo "no-op, nothing-to-refuse, and refusal all behave."

      - name: Chart guard skips identical content and refuses different content
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          oci="oci://ghcr.io/${OWNER}/charts/jmap2telegram"
          helm pull "$oci" --version 0.8.1 --destination "$tmp"
          tar -xzf "${tmp}/jmap2telegram-0.8.1.tgz" -C "$tmp"
          # Repackaged from the published tree: same content, new mtimes -
          # which is precisely why the guard compares content, not digests.
          helm package "${tmp}/jmap2telegram" --destination "${tmp}/identical"
          echo "# deliberately different content" >> "${tmp}/jmap2telegram/values.yaml"
          helm package "${tmp}/jmap2telegram" --destination "${tmp}/different"

          # `publish` is how the workflow gates the push, so assert on it.
          GITHUB_OUTPUT="${tmp}/out" \
            VERSION=0.8.1 LOCAL_TGZ="${tmp}/identical/jmap2telegram-0.8.1.tgz" \
            bash .github/scripts/release-guards.sh chart
          grep -qx 'publish=false' "${tmp}/out" || {
            echo "::error::identical content did not report publish=false"; exit 1; }

          if GITHUB_OUTPUT="${tmp}/out" \
            VERSION=0.8.1 LOCAL_TGZ="${tmp}/different/jmap2telegram-0.8.1.tgz" \
            bash .github/scripts/release-guards.sh chart; then
            echo "::error::the chart guard accepted different content for a published version"
            exit 1
          fi
          grep -qx 'publish=true' "${tmp}/out" || {
            echo "::error::a refused chart left publish=false, so a push step could run"; exit 1; }

          GITHUB_OUTPUT="${tmp}/out" \
            VERSION=9.9.9 LOCAL_TGZ="${tmp}/identical/jmap2telegram-0.8.1.tgz" \
            bash .github/scripts/release-guards.sh chart
          grep -qx 'publish=true' "${tmp}/out" || {
            echo "::error::an unpublished version did not report publish=true"; exit 1; }
          echo "publish, skip and refuse all behave."
