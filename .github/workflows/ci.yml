name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      # The release workflow builds both arches natively itself, so it tells
      # CI to skip the redundant amd64-only docker build. Modelled as an
      # input (not `github.event_name`) because the caller's event name, not
      # `workflow_call`, is what a called workflow sees. Unset (direct
      # push/PR runs) the negation below evaluates true, so the job runs.
      skip_image:
        description: "Skip the amd64 docker-build job (the caller builds the image)."
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --locked: fail loudly if Cargo.lock has drifted from Cargo.toml
      # instead of silently re-resolving it in CI. (It does not, as I first
      # assumed, suppress cargo's "Updating crates.io index" step.)
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  docker-build:
    if: ${{ !inputs.skip_image }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        id: buildx

      # type=gha (below) only caches image layers, not the Dockerfile's
      # RUN --mount=type=cache dirs (cargo registry + target): those are
      # builder-local state that a fresh-per-job GHA runner never has.
      # buildkit-cache-dance extracts/injects them through actions/cache
      # instead, so a Cargo.lock bump only recompiles what changed rather
      # than the whole dependency tree.
      - uses: actions/cache@v4
        id: cache
        with:
          path: cache-mount
          # Scope the key AND the gha cache below to amd64: the release
          # workflow's arm64 leg carries its own cache, and the two must not
          # clobber each other's per-arch cargo target dir. amd64 is named so
          # the release amd64 leg reuses exactly these warm layers.
          key: docker-cache-mount-amd64-${{ hashFiles('Dockerfile', 'Cargo.lock') }}
          restore-keys: docker-cache-mount-amd64-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: jmap2telegram:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/jmap2telegram
      - run: helm template charts/jmap2telegram --set telegram.botToken=dummy --set telegram.authorizedChatIds=1 > /dev/null

  gitleaks:
    # Full git history, not just the diff: a secret introduced then deleted
    # stays detectable. History is clean today (verified 2026-10-05), so no
    # baseline file is needed - a finding should fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks git . --redact --exit-code 1 -v
